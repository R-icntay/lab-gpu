<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lee Lab H100s</title>
<meta name="robots" content="noindex">
<style>
/* Layout: a single board. The 8 cards are the hero (one tile per GPU), then who holds them, bookings, then the week. */
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #161a22; --ink-2: #5a6372; --rule: #dde1e7;
  --free: #eef0f3; --free-edge: #c9ced6;
  --ok: #1f7a4d; --ok-soft: #e2f3ea; --warn: #9a5a00; --warn-soft: #fdf0dc; --bad: #b3261e; --bad-soft: #fbe4e2;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
  --tile-l: 74%; --tile-s: 62%; --tile-ink: #11151c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #171b21; --ink: #e6e9ee; --ink-2: #9aa3b2; --rule: #2a313b;
    --free: #1b2028; --free-edge: #39424f;
    --ok: #6fd3a0; --ok-soft: #13271e; --warn: #f0b660; --warn-soft: #2c2215; --bad: #f08a83; --bad-soft: #2f1716;
    --tile-l: 66%; --tile-s: 50%; --tile-ink: #0d1015; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #171b21; --ink: #e6e9ee; --ink-2: #9aa3b2; --rule: #2a313b;
  --free: #1b2028; --free-edge: #39424f;
  --ok: #6fd3a0; --ok-soft: #13271e; --warn: #f0b660; --warn-soft: #2c2215; --bad: #f08a83; --bad-soft: #2f1716;
  --tile-l: 66%; --tile-s: 50%; --tile-ink: #0d1015; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--sans); }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: max(24px, env(safe-area-inset-top)) 48px;
  display: grid; gap: 22px; }
header { display: grid; gap: 6px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2rem); line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--ink-2); font: 400 0.85rem/1.4 var(--mono); }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 0.78rem/1 var(--mono); padding: 6px 9px;
  border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: var(--ok-soft); }
.pill.bad { color: var(--bad); background: var(--bad-soft); }
.meta { color: var(--ink-2); font-size: 0.85rem; }
.meta.stale { color: var(--warn); }
section { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
h2 { margin: 0; font-size: 0.78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2);
  display: flex; justify-content: space-between; gap: 12px; }
h2 span { letter-spacing: 0; text-transform: none; font-weight: 500; font-family: var(--mono); }
.cards { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
.card { aspect-ratio: 3 / 4; max-width: 100%; border-radius: 6px; display: grid; align-content: space-between; padding: 7px;
  font: 600 0.72rem/1.2 var(--mono); color: var(--tile-ink); overflow: hidden; }
.card .ix { opacity: .8; font-weight: 500; }
.card .who { overflow-wrap: anywhere; }
.card.free { background: var(--free); border: 1.5px dashed var(--free-edge); color: var(--ink-2); }
.card.booked { background: var(--panel); border: 2px solid var(--free-edge); color: var(--ink); }
.card.off { background: repeating-linear-gradient(135deg, var(--free) 0 6px, transparent 6px 12px); border: 1.5px solid var(--free-edge); color: var(--ink-2); }
@media (max-width: 520px) { .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); } .card { aspect-ratio: 4 / 3; }
  .flag { padding: 4px 5px; } }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { font-size: 0.72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 700; }
td.n { font: 500 0.9rem/1 var(--mono); font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
.user { font-family: var(--mono); }
.flag { font: 700 0.72rem/1 var(--mono); padding: 4px 7px; border-radius: 4px; }
.flag.over { color: var(--bad); background: var(--bad-soft); }
.flag.wants { color: var(--warn); background: var(--warn-soft); }
td.note { white-space: normal; min-width: 8rem; color: var(--ink-2); font-size: 0.85rem; }
.empty { color: var(--ink-2); margin: 0; }
.note-line { margin: 0; color: var(--ink-2); font-size: 0.88rem; }
.note-line.warn, .over-note { color: var(--warn); }
.seg { display: flex; gap: 6px; }
button, input, select { font: inherit; color: var(--ink); }
.seg button, .tbl button { background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 5px 10px; font-size: 0.82rem; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--free); border-color: var(--free-edge); font-weight: 600; }
.days { display: grid; gap: 6px; }
.day { display: grid; grid-template-columns: 6.6rem minmax(0, 1fr) 5.6rem; gap: 10px; align-items: center; font-size: 0.86rem; }
.day .v { font: 500 0.8rem/1 var(--mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-2); }
.axis { display: flex; justify-content: space-between; color: var(--ink-2); font: 500 0.68rem/1 var(--mono); }
.tl { display: grid; gap: 2px; padding-block: 2px; border-radius: 4px; background-color: var(--free);
  background-image: linear-gradient(to right, var(--rule) 1px, transparent 1px); background-size: 25% 100%; }
.lane { position: relative; height: 18px; }
.slot { position: absolute; inset-block: 0; min-width: 3px; border-radius: 4px; padding-inline: 4px; overflow: hidden; white-space: nowrap;
  color: var(--tile-ink); font: 600 0.7rem/18px var(--mono); }
.book-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 10px; border-top: 1px solid var(--rule); padding-top: 12px; }
.book-form label, .book-form .field { display: grid; gap: 4px; min-width: 0; color: var(--ink-2); font-size: 0.8rem; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) 5.2rem; gap: 6px; }
.book-form input, .book-form select { width: 100%; min-width: 0; font-size: 1rem; padding: 7px 8px; background: var(--panel); border: 1px solid var(--free-edge); border-radius: 6px; }
.book-form button { align-self: end; padding: 9px 14px; font-weight: 600; color: var(--panel); background: var(--ink); border: 0; border-radius: 6px; cursor: pointer; }
.book-form button:disabled { opacity: .6; cursor: default; }
.book-form .wide { grid-column: 1 / -1; margin: 0; font-size: 0.88rem; }
.msg.bad { color: var(--bad); }
.msg.ok { color: var(--ok); }
@media (max-width: 520px) { .day { grid-template-columns: minmax(0, 1fr) auto; gap: 3px 8px; } .day .tl, .day .axis { grid-column: 1 / -1; grid-row: 2; }
  .day.head > span { display: none; }
  th { letter-spacing: .03em; } th, td { padding: 8px 5px; } .tbl button { padding: 5px 7px; } td.note, td.when { white-space: normal; min-width: 0; } .flag { white-space: nowrap; } }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr) 5.5rem; gap: 10px; align-items: center; font-size: 0.88rem; }
.bar .track { height: 10px; background: var(--free); border-radius: 5px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 5px; }
.bar .v { font: 500 0.82rem/1 var(--mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-2); }
.rule { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 12px 14px; border-radius: 6px; }
.rule p { margin: 0; }
footer { color: var(--ink-2); font-size: 0.8rem; display: grid; gap: 4px; }
code { font: 0.85em var(--mono); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1>Lee Lab H100s</h1>
      <span id="state" class="pill"></span>
    </div>
    <div class="sub" id="sub"></div>
    <div class="meta" id="meta"></div>
  </header>

  <section aria-labelledby="h-cards">
    <h2 id="h-cards">The 8 cards <span id="used"></span></h2>
    <div class="cards" id="cards"></div>
    <p class="note-line" id="free-note" hidden></p>
  </section>

  <section aria-labelledby="h-now">
    <h2 id="h-now">Now <span id="limit-note"></span></h2>
    <div class="tbl" id="now"></div>
  </section>

  <section aria-labelledby="h-book" id="book" hidden>
    <h2 id="h-book">Bookings <span>UK time</span></h2>
    <p class="note-line">Bookings are an agreement, not enforced. The scheduler doesn't know about them, so running jobs aren't stopped.</p>
    <div class="seg">
      <button type="button" id="wk-0" aria-pressed="true">Next 7 days</button>
      <button type="button" id="wk-1" aria-pressed="false">The 7 after</button>
    </div>
    <div class="days" id="days"></div>
    <div class="tbl" id="book-list"></div>
    <form class="book-form" id="book-form">
      <label>Name <select id="bk-user" required></select></label>
      <label>Cards <select id="bk-cards"></select></label>
      <div class="field"><span>From</span><div class="pair"><input type="date" id="bk-from" aria-label="From date" required><select id="bk-from-h" aria-label="From hour"></select></div></div>
      <div class="field"><span>To</span><div class="pair"><input type="date" id="bk-to" aria-label="To date" required><select id="bk-to-h" aria-label="To hour"></select></div></div>
      <label>Lab passcode <input type="password" id="bk-pass" autocomplete="off" required></label>
      <button type="submit" id="bk-go">Book</button>
      <p class="wide over-note" id="bk-over" hidden></p>
      <p class="wide msg" id="bk-msg" role="status" hidden></p>
    </form>
  </section>

  <section aria-labelledby="h-week">
    <h2 id="h-week">Last 7 days <span>GPU-hours</span></h2>
    <div class="bars" id="week"></div>
  </section>

  <div class="rule" id="rule"></div>

  <footer>
    <span>Draft. Sampled from the scheduler every hour; usernames are shortened on this public page.</span>
  </footer>
</div>

<script>
const STATUS = {"updated": "2026-11-14T12:00", "node": "seymour2", "limit": 3, "days": 7, "sample_hours": 1, "state": {"enabled": true, "flags": "", "used": 1, "total": 8}, "members": ["ak••••", "cw••••", "da••••", "ds••••", "eb••••", "el••••", "eo••••", "ew••••", "gu••••", "ka••••", "lc••••", "le••••", "li••••", "mc••••", "mi••••", "sn••••", "sp••••", "zh••••"], "free_takers": 0, "now": [{"user": "el••••", "running": 1, "queued": 0, "can_take": 0, "note": "", "flag": ""}], "slots": ["el••••"], "week": [{"user": "li••••", "gpu_hours": 297, "peak": 8, "over": 54}, {"user": "ak••••", "gpu_hours": 115, "peak": 4, "over": 7}, {"user": "el••••", "gpu_hours": 68, "peak": 2, "over": 0}, {"user": "ew••••", "gpu_hours": 58, "peak": 3, "over": 0}]};
const BOOK_API = "https://lab-gpu-book.lab-gpu-book.workers.dev";   // the booking Worker; empty hides the section
const HORIZON_DAYS = 14;            // matches worker.js
let LAST = STATUS, BOOKINGS = null, BOOK_DOWN = false, WEEK = 0;

function hue(name) {               // stable colour per (masked) user
  let h = 0; for (const c of name) h = (h * 31 + c.codePointAt(0)) % 360; return h;
}
function color(name) { return `hsl(${hue(name)} var(--tile-s) var(--tile-l))`; }
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "style" ? e.style.cssText = v : e.setAttribute(k, v);
  for (const k of kids) e.append(k);
  return e;
}
function ago(iso) {
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min ago`;
  const h = Math.floor(mins / 60), m = mins % 60;
  return h < 48 ? `${h} h ${m} min ago` : `${Math.round(h / 24)} days ago`;
}

// Bookings use UK wall-clock strings (YYYY-MM-DDTHH:00), which compare as text whatever the viewer's timezone.
const UK = new Intl.DateTimeFormat("sv-SE", {timeZone: "Europe/London", dateStyle: "short", timeStyle: "short"});
function ukNow() { return UK.format(new Date()).replace(" ", "T"); }
function addDays(day, n) { return new Date(Date.parse(day + "T00:00Z") + n * 864e5).toISOString().slice(0, 10); }
function hourOf(at) { return Number(at.slice(11, 13)); }
function pad(h) { return String(h).padStart(2, "0"); }
function dayName(day) {
  return new Date(day + "T00:00Z").toLocaleDateString("en-GB", {weekday: "short", day: "numeric", month: "short", timeZone: "UTC"}).replace(",", "");
}
function span(b) {
  const [d1, d2] = [b.start.slice(0, 10), b.end.slice(0, 10)], [t1, t2] = [b.start.slice(11), b.end.slice(11)];
  return d1 === d2 ? `${dayName(d1)} ${t1}–${t2}` : `${dayName(d1)} ${t1} – ${dayName(d2)} ${t2}`;
}
function peak(start, end, user) {       // most cards booked at any moment in [start, end), by one person if given
  const list = BOOKINGS.filter(b => !user || b.user === user);
  const at = [start, ...list.map(b => b.start).filter(t => t > start && t < end)];
  return Math.max(...at.map(t => list.filter(b => b.start <= t && b.end > t).reduce((n, b) => n + b.cards, 0)));
}
function heldNow(s) {                   // one entry per card booked right now and not already in use by its booker
  if (!BOOKINGS) return [];
  const at = ukNow(), want = {};
  for (const b of BOOKINGS) if (b.start <= at && b.end > at) want[b.user] = (want[b.user] || 0) + b.cards;
  return Object.entries(want).flatMap(([u, n]) => Array(Math.max(0, n - s.slots.filter(x => x === u).length)).fill(u));
}
function freeNote(s, held) {
  const free = s.state.total - s.state.used, note = document.getElementById("free-note");
  const stuck = s.now.filter(r => r.queued && !r.can_take).map(r => `${r.user}: ${r.note}`).join("; ");
  const queue = free && s.free_takers ? `Queued jobs can take ${s.free_takers} of the ${free} free.`
              : free && stuck ? `Nothing queued will take the ${free} free. ${stuck}.` : "";
  const booked = held.length > free ? `${held.length} booked now, but only ${free} free.` : "";
  const text = s.state.enabled ? [booked, queue].filter(Boolean).join(" ") : "";
  note.textContent = text;
  note.hidden = !text;
  note.className = "note-line" + (held.length > free ? " warn" : "");
}

function renderDays(s) {
  const days = document.getElementById("days"), first = addDays(ukNow().slice(0, 10), WEEK * 7);
  days.replaceChildren(el("div", {class: "day head"}, el("span"), el("div", {class: "axis", "aria-hidden": "true"},
    ...["00", "06", "12", "18", "24"].map(h => el("span", {}, h))), el("span")));
  for (let i = 0; i < 7; i++) {
    const day = addDays(first, i), next = addDays(day, 1), [a, z] = [day + "T00:00", next + "T00:00"];
    const on = BOOKINGS.filter(b => b.start < z && b.end > a);
    const hours = Array.from({length: 24}, (_, h) => `${day}T${pad(h)}:00`).filter(t => on.some(b => b.start <= t && b.end > t)).length;
    const tl = el("div", {class: "tl"});
    for (const b of on) {
      const from = b.start < a ? 0 : hourOf(b.start), to = b.end >= z ? 24 : hourOf(b.end);
      tl.append(el("div", {class: "lane"}, el("div", {class: "slot", title: `${b.user}: ${b.cards} GPU${b.cards > 1 ? "s" : ""}, ${span(b)}`,
        style: `left:${100 * from / 24}%;width:${100 * (to - from) / 24}%;background:${color(b.user)}`}, `${b.cards} ${b.user}`)));
    }
    if (!on.length) tl.append(el("div", {class: "lane"}));
    days.append(el("div", {class: "day"}, el("span", {}, dayName(day)), tl,
      el("span", {class: "v"}, on.length ? `${peak(a, z)}/${s.state.total} · ${hours} h` : "free")));
  }
}

function renderBookList(s) {
  const list = document.getElementById("book-list");
  list.replaceChildren();
  if (!BOOKINGS.length) return list.append(el("p", {class: "empty"}, "No bookings yet."));
  const tb = el("tbody");
  for (const b of BOOKINGS) {
    const x = el("button", {type: "button"}, "Cancel");
    x.onclick = () => cancelBooking(b);
    tb.append(el("tr", {}, el("td", {class: "user"}, el("span", {class: "sw", style: `background:${color(b.user)}`}), b.user),
      el("td", {class: "n"}, String(b.cards)),
      el("td", {class: "when"}, span(b), " ", peak(b.start, b.end, b.user) > s.limit ? el("span", {class: "flag over"}, `OVER ${s.limit}`) : ""), el("td", {}, x)));
  }
  list.append(el("table", {}, el("thead", {}, el("tr", {}, ...["Person", "Cards", "When", ""].map(h => el("th", {}, h)))), tb));
}

function renderBookings(s) {
  const up = !!BOOKINGS;
  document.getElementById("book").hidden = !BOOK_API;
  document.getElementById("book-form").hidden = !up;
  document.querySelector(".seg").hidden = !up;
  document.getElementById("book-list").hidden = !up;
  if (up) { renderDays(s); renderBookList(s); checkOver(); }
  else document.getElementById("days").replaceChildren(el("p", {class: "empty"}, BOOK_DOWN ? "Bookings can't be reached right now." : "Loading bookings…"));
}

function field(id) { return document.getElementById(id); }
function remember(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
function recall(key) { try { return localStorage.getItem(key) || ""; } catch (e) { return ""; } }
function say(text, kind) { const m = field("bk-msg"); m.textContent = text; m.className = "wide msg " + kind; m.hidden = !text; }
function formBooking() {
  return {user: field("bk-user").value, cards: Number(field("bk-cards").value),
          start: `${field("bk-from").value}T${field("bk-from-h").value}:00`, end: `${field("bk-to").value}T${field("bk-to-h").value}:00`};
}
function checkOver() {
  const b = formBooking(), mine = b.user && b.end > b.start ? peak(b.start, b.end, b.user) : 0, over = field("bk-over");
  const limit = LAST.limit;
  over.textContent = `This goes over the lab's ${limit}-card rule. Please say so in the lab channel first.`;
  over.hidden = mine + b.cards <= limit;
}
async function api(path, method, body) {
  try {
    const r = await fetch(BOOK_API + path, {method, headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    return await r.json();
  } catch (e) { return {error: "The booking service can't be reached."}; }
}
async function loadBookings() {
  if (!BOOK_API) return;
  try {
    const r = await fetch(BOOK_API + "/bookings", {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    BOOKINGS = (await r.json()).bookings;
    BOOK_DOWN = false;
  } catch (e) { BOOK_DOWN = true; }
  if (LAST) render(LAST);
}
async function cancelBooking(b) {
  const passcode = field("bk-pass").value;
  if (!passcode) { say("Enter the lab passcode to cancel.", "bad"); return field("bk-pass").focus(); }
  if (!confirm(`Cancel ${b.user}'s booking, ${span(b)}?`)) return;
  const r = await api(`/bookings/${b.id}`, "DELETE", {passcode});
  say(r.error || "Booking cancelled.", r.error ? "bad" : "ok");
  await loadBookings();
}
async function submitBooking(e) {
  e.preventDefault();
  const go = field("bk-go"), passcode = field("bk-pass").value, b = formBooking();
  go.disabled = true;
  const r = await api("/bookings", "POST", {...b, passcode});
  go.disabled = false;
  say(r.error || `Booked: ${b.cards} GPU${b.cards > 1 ? "s" : ""}, ${span(b)}.`, r.error ? "bad" : "ok");
  if (r.error) return;
  remember("labgpu-user", b.user);
  remember("labgpu-pass", passcode);
  await loadBookings();
}
function setWeek(n) {
  WEEK = n;
  field("wk-0").setAttribute("aria-pressed", n === 0);
  field("wk-1").setAttribute("aria-pressed", n === 1);
  renderDays(LAST);
}
function setUpForm(s) {
  const today = ukNow().slice(0, 10), tomorrow = addDays(today, 1), hours = Array.from({length: 24}, (_, h) => pad(h));
  const options = (id, values, chosen) => {
    field(id).replaceChildren(...values.map(v => el("option", {value: v}, v)));
    field(id).value = chosen;
  };
  options("bk-user", ["", ...(s.members || [])], recall("labgpu-user"));
  options("bk-cards", ["1", "2", "3", "4", "5", "6", "7", "8"], "2");
  options("bk-from-h", hours, "08");
  options("bk-to-h", hours, "20");
  for (const id of ["bk-from", "bk-to"]) {
    field(id).min = today;
    field(id).max = addDays(today, HORIZON_DAYS);
    field(id).value = tomorrow;
  }
  field("bk-pass").value = recall("labgpu-pass");
  field("book-form").addEventListener("input", checkOver);
  field("book-form").addEventListener("submit", submitBooking);
  field("wk-0").onclick = () => setWeek(0);
  field("wk-1").onclick = () => setWeek(1);
}

function render(s) {
  const st = s.state, on = st.enabled;
  const state = document.getElementById("state");
  state.className = "pill " + (on ? "ok" : "bad");
  state.textContent = on ? "queue open" : "queue disabled";
  document.getElementById("sub").textContent = `${s.node} · 8 × NVIDIA H100 80 GB · project leelab · rule: max ${s.limit} per person`;
  const hrs = (Date.now() - new Date(s.updated)) / 3.6e6;
  const meta = document.getElementById("meta");
  meta.textContent = `Updated ${s.updated.replace("T", " ")} (${ago(s.updated)})` + (hrs > 2.5 ? " · stale: the sampler may have stopped" : "");
  meta.className = "meta" + (hrs > 2.5 ? " stale" : "");

  const held = heldNow(s);
  document.getElementById("used").textContent = `${st.used} in use · ${st.total - st.used} free` + (held.length ? ` · ${held.length} booked` : "");
  const cards = document.getElementById("cards"); cards.replaceChildren();
  for (let i = 0; i < st.total; i++) {
    const who = s.slots[i];
    const owner = held[i - s.slots.length];
    if (who) cards.append(el("div", {class: "card", style: `background:${color(who)}`, title: `GPU slot ${i + 1}: ${who}`},
      el("span", {class: "ix"}, `#${i + 1}`), el("span", {class: "who"}, who)));
    else if (owner && on) cards.append(el("div", {class: "card booked", style: `border-color:${color(owner)}`, title: `Free, booked by ${owner}`},
      el("span", {class: "ix"}, `#${i + 1}`), el("span", {class: "who"}, owner, el("br"), "booked")));
    else cards.append(el("div", {class: on ? "card free" : "card off", title: on ? "free" : "queue disabled"},
      el("span", {class: "ix"}, `#${i + 1}`), el("span", {}, on ? "free" : "off")));
  }

  freeNote(s, held);
  document.getElementById("limit-note").textContent = `flags above ${s.limit}`;
  const now = document.getElementById("now"); now.replaceChildren();
  if (!s.now.length) now.append(el("p", {class: "empty"}, on ? "Nobody is using or queued for the lab GPUs." : "Nobody is using the lab GPUs; nothing can start until the queue is re-enabled."));
  else {
    const t = el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, "Person"), el("th", {}, "Running"), el("th", {}, "Queued"), el("th", {}, "Notes"))));
    const tb = el("tbody");
    for (const r of s.now) {
      const f = r.flag === "over" ? el("span", {class: "flag over"}, `OVER ${s.limit}`)
              : r.flag === "wants" ? el("span", {class: "flag wants"}, `WANTS >${s.limit}`) : "";
      tb.append(el("tr", {}, el("td", {class: "user"}, el("span", {class: "sw", style: `background:${color(r.user)}`}), r.user),
        el("td", {class: "n"}, String(r.running)), el("td", {class: "n"}, String(r.queued)), el("td", {class: "note"}, r.note, r.note && f ? " " : "", f)));
    }
    t.append(tb); now.append(t);
  }

  const week = document.getElementById("week"); week.replaceChildren();
  if (!s.week.length) week.append(el("p", {class: "empty"}, "No lab GPU use recorded in the last 7 days."));
  const max = Math.max(1, ...s.week.map(w => w.gpu_hours));
  for (const w of s.week) week.append(el("div", {class: "bar"},
    el("span", {class: "user"}, el("span", {class: "sw", style: `background:${color(w.user)}`}), w.user),
    el("div", {class: "track"}, el("div", {class: "fill", style: `width:${100 * w.gpu_hours / max}%;background:${color(w.user)}`})),
    el("span", {class: "v"}, `${w.gpu_hours} h · peak ${w.peak}`)));

  renderBookings(s);

  document.getElementById("rule").replaceChildren(el("p", {},
    el("b", {}, `Lab rule: at most ${s.limit} of the 8 lab H100s per person. `),
    `If you need more, say so in the lab channel first. "WANTS" means running + queued jobs would take someone above ${s.limit}; a capped array counts only up to its -tc limit.`));
}

if (STATUS) { setUpForm(STATUS); render(STATUS); }
loadBookings();
async function refresh() {
  try { const r = await fetch("status.json", {cache: "no-store"}); if (r.ok) LAST = await r.json(); } catch (e) {}
  await loadBookings();
  if (LAST && !BOOK_API) render(LAST);
}
setInterval(refresh, 10 * 60 * 1000);   // an open tab picks up the next sample
</script>
</body>
</html>
